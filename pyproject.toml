[project]
name = "nknu-facts"
version = "1.0.0"
description = "NKNU campus fact layer exposed over MCP (read-only, no LLM in the serving path)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "selectolax==1.0.1",
    "fastmcp==4.1.3",
    "mcp==2.3.0",
    "uvicorn",
    "stamina",
    "warcio",
    "icalendar",
    "recurring-ical-events",
    "opencc-python-reimplemented",
    "typer",
    "pyyaml",
    "tzdata",
    "certifi",
    "pandas",
    "lxml",
]

[project.scripts]
nknu = "nknu.admin.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "tiktoken", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nknu"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: 会连到真实网站"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["prototypes"]
