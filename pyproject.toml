[project]
name = "nknu-facts"
version = "1.0.0"
description = "NKNU campus fact layer exposed over MCP (read-only, no LLM in the serving path)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "selectolax==1.0.1",
    "fastmcp==4.1.3",
    "mcp==2.3.0",
    "uvicorn",
    "stamina",
    "warcio",
    "opencc-python-reimplemented",
    "typer",
    "pyyaml",
    "tzdata",
    "certifi",
    "pandas",
    "lxml",
    "protego>=0.7.0",
]

[project.optional-dependencies]
# `nknu archive jscheck` (round-1 design §8.4): Playwright drives this machine's own Chrome (channel chrome), so no
# browser is downloaded; the 10-25 test's version. Never a required dependency
browser = ["playwright==1.64.1"]

[project.scripts]
nknu = "nknu.admin.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "tiktoken", "pip-licenses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nknu"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: 会连到真实网站", "browser: 用本机 Chrome（Playwright）跑，只连本机回环的测试服务器；没装就跳过"]
testpaths = ["tests"]
# pytest skips dirs named "build" by default; tests/build holds the serve.db tests
norecursedirs = [".*", "*.egg", "dist", "node_modules", "venv", "prototypes"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["prototypes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
