# Answer sentences (Traditional Chinese). Every sentence states its validity and its source.
# Bump template_ver whenever wording changes; cards record the version they were rendered with.
template_ver: 1
hours_open: "{name} {span}開放{note}：{schedule}{closed_days}。來源：{publisher}《{title}》。"
hours_closed: "{name} {span}：暫停開放（{reason}）。來源：{publisher}《{title}》。"
hours_conflict: "{name} {span} 的開放時間有 {n} 個同等級官方來源不一致（{sources}），已送人工審核，請以現場公告為準。"
hours_stale: "{name} 自 {from_} 起查無有效的開放時間資料；最近一筆官方資料有效至 {last_to}，新時段尚未公布。請勿推測，可洽{contact}。"
hours_no_data: "{name} 查無開放時間資料。請勿推測，可洽{contact}。"
calendar_event: "{span}：{summary}。來源：{publisher}《{title}》。"
calendar_list: "{span}{kw}行事曆事件共 {n} 筆。來源：{sources}。"
calendar_none: "{span}查無{kw}行事曆事件。請勿推測，可洽{contact}。"
fact_stale: "此筆資料（{span}，來源：{publisher}《{title}》）{why}，不是現行資料。請勿推測，請改查現行資料。"
