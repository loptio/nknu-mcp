# Units: what the site list (research/site_probe_2026-10-23/data.json) does not say (addendum 2026-11-02 F, task T6c;
# read by nknu.content.units.load_units). Keys are names as the list writes them, a trailing note in brackets left out.
#   campus:   和平 or 燕巢, the campus whose students the unit serves: a department's is where it is, a 教務處 section's
#             the campus whose 學系 it handles (it counts when a query names the section; the section's own documents
#             still apply to the whole school, see units.reach). Units under it take it unless they set their own. A
#             unit serving both campuses has none, wherever its office is (招生企劃組, 教務創新組, 綜合業務組 and
#             學分學程中心 run school-wide work from 和平).
#   aliases:  other names the school writes (short names), matched like names.
#   parent:   the unit it belongs to, when the list gives none or a wrong one.
#   name:     the name used here when the list's is ambiguous; the list's name is then matched no more.
#   kind + parent: a unit the list does not have.
#   evidence: required. Where the 教務處 export archive-export/aca-20261102 (read-only) says so: the file under pages/
#             (or files/) by its number, the page, and a short quote (spaces squashed, NFKC; no personal names).
#             For a unit that export does not name: the site probe (普查, research/site_probe_2026-10-23/data.json: an
#             entry's name, alias or parent as the school writes it), or a pilot export of the unit's own site
#             (../mvp-lite-lab-transfer/pilot-20261108/<site folder>, outside the repo, read-only), cited the same way.
# An entry without evidence stays out, and the unit's campus stays unknown. 教務處's 組 as the build's grp writes them
# (和平教務組, 燕巢教務組, 招生企劃組, 綜合業務組, 教務創新組, 學分學程中心) are the list's own names.
units:

  # --- campus: the colleges (departments, institutes and programmes under them take it) ---------------------------------
  文學院:
    campus: 和平
    evidence: >-
      pages/0093「和平教務組 - 編制與業務」：「承辦日間學制文學院：(含大學部、研究所)各項教務業務」，列出國文系、英語系、地理系；
      同页「承辦日間學制獨立研究所：(研究所) 各項教務業務」列出本院的臺研所、經學所、華文所、客文所。
      pages/0267（113 学年度转系公告）：「送和平教務組（和平校區學系）或燕巢教務組（燕巢校區學系）彙辦」。
  教育學院:
    campus: 和平
    evidence: >-
