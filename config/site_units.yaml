# 网站对单位小表（计划 2026-11-08 T3；设计稿 2026-11-08 §二 6）：第一轮名单 config/archive_round1.json 的每个网站键一行
# （第一轮的 107 个网站，再加附加起点的 4 个网站键；11-17 起再加爬虫交来的第二轮网站），对到单位树（nknu.content.units：网站普查
# research/site_probe_2026-10-23/data.json 加 config/units.yaml）里的单位编号。nknu.content.sites 读它。
# 由 research/step3_2026-11-08/site_units.py 产生，不要手改：要改先改脚本里的手填行（HAND、EXTRA），再跑
#   uv run --no-sync python research/step3_2026-11-08/site_units.py
# （第二轮的网站改脚本里的 ROUND2_IN、ROUND2）
#   unit:   单位编号（单位树里的名字）。
#   how:    auto: 程序对上的（第一轮名称、它的繁体、去掉「品保網站」、普查里网址在这个网站的单位）；hand: 手填，写理由，
#           不确定的记全校并写明。
#   shared: true 的是很多单位共用的平台（全校公告系统、SSO 根目录和共用模块）：别的网站导出里带到的这里的网页和档，算那个
#           网站的单位；这个网站自己导出的才算这一行的单位。
# 一份文件的单位看它自己网址所属的网站（别的网站共用的档算它主人的单位）；网址的网站不在表里（校外、SSO 的 webservices
# 档案服务）或是 shared 的，算它所在导出的网站的；都不知道就算全校（school）。它只决定结果里显示的发布单位（单位加减分
# 11-08 起是 0），第 4 步再把单位名放进关键词索引和 passage。

