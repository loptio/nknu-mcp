<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>電子工程學系</title>
<script>
	$(function()
	{
		$(".down").each(function()
		{
			$(this).click(function()
			{
				$.ajax(
				{
					type:"POST",
					url: "fileAjax.html",
					data:
					{
						id : $(this).find('.download').val(),
						k : 2
					},
					success: function(data)
					{
						window.open(data,"_blank");
					}
				});
			});
		});
	});
</script>
</head><body>
<div id="ne_list">
<a href="javascript:" class="down"><input type="hidden" value="61" class="download"><p>1</p><p>課程系統表-甲</p></a>
<a href="javascript:" class="down"><input type="hidden" value="62" class="download"><p>2</p><p>課程系統表-乙</p></a>
</div>
</body></html>
