# Calibration set for the bigram-coverage thresholds T_LOW / T_HIGH (spec §6.5): 29 queries that are not in queries.yaml,
# in the same mix (short keywords, long questions, English, questions v1 cannot answer). Same format as queries.yaml.
# The noans include the shapes that once scored high on words every card has: an unknown place + an hours question,
# a known place + a word its card does not answer, and a place on the other campus.
# The 9 added in G6 have the shapes of the real phrasings: words typed without spaces, a school or unit name, close words.
# `uv run python -m tests.search.evaluate --calibrate` grid-searches the thresholds on this set.

- {q: 和平體育館 幾點開, type: place, gold: [{card: {entity: nknu.heping.gym.main, intent: hours}}]}
