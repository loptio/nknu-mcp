# Search regression set (spec §6.5): 80 queries rewritten from prototypes/search/queries.py, 10 of them English.
# gold: any listed item at rank 1 counts for R@1, within the first 5 facts for R@5. Gold kinds:
#   {card: {entity, intent}}            an answer card of that place (search returns the card for on_date)
#   {calendar: {category, summary_re?}} an academic-calendar event (summary_re narrows category `other`)
#   {doc: {title_re}}                   a current notice whose title matches
# type noans + gold []: v1 crawls no source that answers it (bus, student id, parking, donations, …; spec §15.2), so the
# right answer is found=false. Every gold item must exist in the fixture world as of 2026-10-22 (test_every_gold_exists).

