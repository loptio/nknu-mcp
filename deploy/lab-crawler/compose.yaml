# 爬虫在实验室电脑上跑（仓库里的位置 deploy/lab-crawler/compose.yaml；在 Windows 上是 C:\nknu-crawl\compose.yaml）。
# 命令（PowerShell 或经 SSH 的 cmd，前面加 set "DOCKER_CONFIG=%USERPROFILE%\.docker-ssh" &）：
#   docker compose -f C:\nknu-crawl\compose.yaml run --rm nightly      每晚的定期更新（工作排程器 01:00 跑的就是这一行）
#   docker compose -f C:\nknu-crawl\compose.yaml up -d viewer          开旧看板（只读；可以随时开关，不影响爬虫）
#   docker compose -f C:\nknu-crawl\compose.yaml run --rm stop         有计划地停：写 STOP，正在跑的抓取做完手上的请求就结束
#   docker compose -f C:\nknu-crawl\compose.yaml run --rm status       爬虫健康报告（不连网）
#   docker compose -f C:\nknu-crawl\compose.yaml run --rm rejudge --sites <网站键,…>   规则改了重算（不连网、不重抓）
# 手动跑别的脚本（补抓、导出几个站、试跑）也用 nightly 这个服务，它带着程序、锁、金钥和要挂的资料夹：
#   docker compose -f C:\nknu-crawl\compose.yaml run --rm -v C:/nknu-crawl/in/<资料夹>:/in:ro nightly bash /in/<脚本>.sh
# 从 Mac 看旧看板：ssh -N -L 18877:127.0.0.1:8877 nknu-lab，再打开 http://127.0.0.1:18877/progress
# 资料：具名磁碟区 nknu-crawl（/crawl：code-update 每晚和手动用的程序、export-code 白天导出用的程序、viewer-code
# 看板的程序、archive 的账本和报告、locks 锁），抓下来的大档在 D:\nknu-crawl\warc，账本每晚的备份在
# D:\nknu-crawl\backup\nightly。正式存档以这台为准，绝不在 Mac 上开爬（两台的锁互相管不到）。
# 金钥只给会连 Google 的服务：C:\nknu-crawl\secrets\google.env 唯读挂进去，由脚本载入，绝不印出；看板不挂金钥。
# 第一轮开爬时用的 crawler、dryrun、rehearse 三个服务和它们的 /crawl/code（11-09 的程序）11-19 从这份拿掉了：
# 现在的抓取都由 nightly 走；那三支脚本留在 research/crawler_lab_2026-11-04/。
name: nknu-crawl

x-tool: &tool
  # 手动工具：和每晚同一份程序（/crawl/code-update），不连网、不挂金钥
  image: nknu-pipeline
  working_dir: /crawl/code-update
  network_mode: none
  environment:
    TZ: Asia/Taipei
    PYTHONPATH: /crawl/code-update/src
    PYTHONDONTWRITEBYTECODE: "1"
    NKNU_SCHOOL_LOCK: /crawl/locks/school-requests.lock
  profiles: ["tools"]

services:
  stop:
    <<: *tool
    volumes:
      - nknu-crawl:/crawl
    command: ["python", "-c", "from nknu.admin.cli import app; app()", "archive", "stop", "--dir", "/crawl/archive"]
  status:
    <<: *tool
    volumes:
      - nknu-crawl:/crawl
      - D:/nknu-crawl/warc:/crawl/archive/warc:ro
    command: ["python", "-c", "from nknu.admin.cli import app; app()", "archive", "status", "--dir", "/crawl/archive"]
  rejudge:
    # 规则或平台读法改了以后重算已存的网页（不重抓）：没有抓取在跑、run.lock 空着才做；只读 WARC。
    #   docker compose -f C:\nknu-crawl\compose.yaml run --rm rejudge --sites <网站键,逗号分隔>
    <<: *tool
    volumes:
      - nknu-crawl:/crawl
      - D:/nknu-crawl/warc:/crawl/archive/warc:ro
    entrypoint: ["python", "-c", "from nknu.admin.cli import app; app()", "archive", "rejudge", "--dir", "/crawl/archive"]
  nightly:
    # 每晚的定期更新（11-16 第一次真跑以后，用户「先修这三件」）：排程只跑这一行，不再手打一长串：
    #   docker compose -f C:\nknu-crawl\compose.yaml run --rm nightly
    # （Windows 工作排程器跑 C:\nknu-crawl\nightly_update.cmd，它就是这一行加一份 log；排程的时间等用户定）
    # 程序是 /crawl/code-update（定期更新的程序；爬虫的 /crawl/code 不动），时区台北、全机锁、备份放 D 槽
    # D:\nknu-crawl\backup\nightly（nightly-*.db 留 7 份），存网页的资料夹要能写、要连网、要金钥（Google 的网址）。
    # 少一样，脚本开跑前就停在 preflight、什么都不动（nightly_update.sh 第 0 步）。
    # 11-18 (计划 2026-11-17-jsfetch-integration 第 6 件)：nknu-browser = nknu-pipeline 加 Chrome（js爬虫 11-17 做的映像），
    # 每晚给要 JavaScript 的网站开浏览器（/crawl/code-update/lab/js_sites.txt）；Chrome 要比 Docker 默认 64 MB 大的共享记忆体
    image: nknu-browser
    shm_size: "1gb"
    working_dir: /crawl/code-update
    environment:
      TZ: Asia/Taipei
      PYTHONPATH: /crawl/code-update/src
      PYTHONDONTWRITEBYTECODE: "1"
      NKNU_SCHOOL_LOCK: /crawl/locks/school-requests.lock
      BACKUPS: /backup-nightly
    volumes:
      - nknu-crawl:/crawl
      - D:/nknu-crawl/warc:/crawl/archive/warc
      - D:/nknu-crawl/backup/nightly:/backup-nightly
      - C:/nknu-crawl/secrets/google.env:/run/secrets/google.env:ro
      # 导出那一批 T7：每晚导出有变动的网站到 /work/archive-export/sites（导出服务的资料夹），最后写 seen.tsv；
      # 不删内容 session 的 exports*.txt 写着的资料夹（/work/research/pipeline_2026-11-02）
      - nknu-work:/work
    command: ["bash", "/crawl/code-update/lab/nightly_update.sh"]
    profiles: ["tools"]
    restart: "no"
  viewer:
    # 看板（设计 2026-11-04 §3）：和爬虫同一个磁碟区，run.lock 的锁和资料库才读得准；只读资料库，只写自己的索引
    # viewer-index.db 和 reports/ 里的问题记录。容器里听 0.0.0.0，Docker 只从这台电脑自己的 127.0.0.1 转进来。
    # 看板的程序放进 /crawl/viewer-code（第一次开和每次换看板都要；不动爬虫的 /crawl/code）。用和 /crawl/code 同一个包
    # （src、config、certs、research 里 10-25 的网页类型测试结果：monitor 读 round1.load()、pagetypes 读那份结果；
    # 11-04 的 viewer-code.tgz 也是这样打的，不是只有 src）。爬虫的程序一换，这份也一起换（11-06：看板用自己这份的
    # outcome 规则重算结果，两份不同，看板和 nknu archive status 就说法不同）：
    #   1. docker compose -f C:\nknu-crawl\compose.yaml stop viewer（先停：开着换，它之后才载入的模组会是新的，新旧混用）
    #   2. docker run --rm --network none -v nknu-crawl:/crawl -v C:/nknu-crawl/<包>.tgz:/in.tgz:ro nknu-pipeline sh -c
    #      "set -e; rm -rf /crawl/viewer-code.new; mkdir /crawl/viewer-code.new; tar -xzf /in.tgz -C /crawl/viewer-code.new
    #       --no-same-owner; cd /crawl/viewer-code.new; sha256sum -c --quiet MANIFEST.sha256; rm -rf /crawl/viewer-code.prev;
    #       mv /crawl/viewer-code /crawl/viewer-code.prev; mv /crawl/viewer-code.new /crawl/viewer-code"
    #   3. docker compose -f C:\nknu-crawl\compose.yaml up -d viewer
    # 程序还没放进去时，容器不会一直开了又停：每分钟写一行「还没放进去」，放好以后一分钟内自己开起来。
    image: nknu-pipeline
    working_dir: /crawl/viewer-code
    environment:
      TZ: Asia/Taipei
      PYTHONPATH: /crawl/viewer-code/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - nknu-crawl:/crawl
      - D:/nknu-crawl/warc:/crawl/archive/warc:ro
    command: ["sh", "-c", "until [ -f /crawl/viewer-code/src/nknu/archive/viewer.py ]; do
              echo '看板的程序还没放进 /crawl/viewer-code/src（步骤见 compose.yaml 的 viewer 说明）'; sleep 60; done;
              exec python -c 'from nknu.admin.cli import app; app()' archive browse --dir /crawl/archive
              --host 0.0.0.0 --port 8877"]
    ports:
      - "127.0.0.1:8877:8877"
    restart: unless-stopped

volumes:
  nknu-crawl:
    external: true
  nknu-work:
    external: true
