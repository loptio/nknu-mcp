<title>資料總覽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a title bar; left column = the map of the sites (treemap), the dates chart, the site list; right column = one
   sticky inspector for the current scope (all / a unit / a site). One selection model drives every part.
   Colour has two jobs (checked with the dataviz validator, both themes, all pairs, simulated colour blindness), and --bad
   marks what failed:
   - what kind of document: four hues placed like the Okabe-Ito colour-blind-safe set (blue, sky, orange, bluish green), a little
     softer in the light theme because they fill large blocks: the blocks inside every map tile, the donut, the kinds' chips
     and lines, the thin bars of the list. The two kinds of web page share the blue family (公告 dark, 一般網頁 light), files
     are orange, calendar events green, links a light grey. Blue means these two kinds and nothing else;
   - how many, and how much is missing: one violet ramp, fewer lighter (owner 11-15, of the counts drawn in blue for a while:
     「藍色已經定義過是公告和一般網站了，其他地方普遍用紫色來表達多和少」, and 「文件數量的表達換紫色而已」): the map's
     three lenses, the meters of 資料品質, the hover card's rows, the calendar's steps; and in one step of it, --amt (--q4:
     4.5:1 on the light surface, 5.2:1 on the dark), the dates line and its wash, the bars of the years, the list's small
     bars, ranked rows. One kind picked: that kind's own hue (the line is then that kind's).
   What is picked or switched on is ink, like a picked tile's ring: no data colour. */
/* colours, type and the panels' top bar: nknu/ops/theme/theme.css, put before this sheet by server.py (11-17) */
:root { --barh: 52px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; text-underline-offset: 2px; }
h2, h3, h4 { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.app { max-width: var(--page); margin: 0 auto; padding-block: 0 28px; padding-inline: var(--gutter); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center;
  justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 12px 0 10px; }
.tb-l { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-size: 13px; min-width: 0; color: var(--ink3); }
.crumbs button { padding: 2px 7px; border-radius: 7px; color: var(--ink2); }
.crumbs button:hover { background: var(--hover); color: var(--ink); }
.crumbs .cur { padding: 2px 7px; font-weight: 650; color: var(--ink); }
.crumbs .sep { color: var(--ink3); }
.crumbs .meta { font-variant-numeric: tabular-nums; }
/* shown only when the page cannot reach the lab PC or the last update failed; the data on show is then the last one */
.live { font-size: 12px; color: var(--bad); white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--line2); }
.chip i { font-style: normal; color: var(--ink3); padding: 0 4px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--hover); }
.seg button { padding: 3px 10px; border-radius: 7px; font-size: 12px; color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06); }
.seg button:disabled { opacity: .4; cursor: default; }
.seg.ic button { padding: 4px 8px; }
svg.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
.find { position: relative; }
.find input { width: 190px; padding: 6px 10px 6px 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
.find input::placeholder { color: var(--ink3); }
.find > svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink3); }
.find-list { position: absolute; right: 0; top: calc(100% + 6px); width: 320px; max-width: 86vw; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.14); z-index: 40; }
.find-list button { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; width: 100%; padding: 7px 10px; border-radius: 8px; }
.find-list button.act, .find-list button:hover { background: var(--hover); }
.find-list small { color: var(--ink3); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find-list b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find-list em { font-style: normal; color: var(--ink3); grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; }

/* grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; position: relative; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2 { font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-h h2 span { font-weight: 400; color: var(--ink3); }
.card-h.cm { justify-content: flex-start; gap: 8px 10px; }
.card-h.cm h2 { margin-right: 6px; }
.card-h.cm .tog { margin-left: auto; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span { color: var(--ink3); font-size: 12px; }
.side { grid-column: 2; grid-row: 1 / span 3; align-self: stretch; }
.side-in { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh)); max-height: calc(100vh - var(--barh) - 16px); overflow: auto; scrollbar-width: thin; }
.empty { padding: 36px 0; text-align: center; color: var(--ink3); }
.tog { padding: 4px 9px; border-radius: 8px; font-size: 12px; color: var(--ink2); border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
.tog:hover { color: var(--ink); border-color: var(--line2); }
.tog[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.help { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line2); color: var(--ink3); font-size: 12px; text-align: center; line-height: 18px; }
.help:hover, .help[aria-expanded="true"] { color: var(--ink); border-color: var(--ink3); }
.key { position: absolute; left: 16px; top: 46px; z-index: 30; width: 310px; max-width: calc(100% - 32px); padding: 12px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line2); box-shadow: 0 12px 32px rgba(0,0,0,.16); display: grid; gap: 10px; }
.key h4 { font-size: 13px; font-weight: 650; }
.key h4 span { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.key-r { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; color: var(--ink2); font-size: 12px; }
.key-r > span:first-child { display: flex; align-items: flex-end; gap: 3px; justify-content: flex-end; }
.kb i { display: block; background: var(--line2); border-radius: 2px; }
.kmini { display: grid; grid-template-columns: 34px 22px; grid-template-rows: 20px 14px; gap: 1px; width: 58px; height: 36px; border-radius: 4px; overflow: hidden; }
.kmini i { display: block; }
.key .ramp i { width: 10px; }
@media (max-width: 1020px) {
  .kl { max-width: 400px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .side { grid-column: 1; grid-row: 2; }
  .side-in { position: static; max-height: none; }
}

/* treemap */
/* a tile is a site; the blocks inside it are its kinds of document, each block's area its share of the site */
/* clipped: a tile or unit name faded out keeps its last place, and after the window narrows that place can lie past the
   edge and widen the page (the rings of a tile are drawn inside it, so nothing shown is cut) */
.tm { position: relative; height: 500px; overflow: hidden; }
.tile { position: absolute; border-radius: 5px; overflow: hidden; cursor: pointer; background: var(--surface); color: var(--on-k);
  transition: left .36s cubic-bezier(.2,.7,.2,1), top .36s cubic-bezier(.2,.7,.2,1), width .36s cubic-bezier(.2,.7,.2,1), height .36s cubic-bezier(.2,.7,.2,1), opacity .2s, background-color .25s; }
.tile.lens { background: var(--fill, var(--qx)); color: var(--ink); }
.tile.lens.inv { color: var(--surface); }
.tile.onw { color: var(--on-w); }
.tile.md { border-radius: 3px; }
.tile.sm { border-radius: 2px; }
.tile.gone { opacity: 0; pointer-events: none; }
.tile.dim { opacity: .14; }
.kr { position: absolute; display: block;
  transition: left .36s cubic-bezier(.2,.7,.2,1), top .36s cubic-bezier(.2,.7,.2,1), width .36s cubic-bezier(.2,.7,.2,1), height .36s cubic-bezier(.2,.7,.2,1), opacity .2s; }
.tile.lens .kr { opacity: 0; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.tile:hover::after { box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 3.5px var(--surface); }
.tile.sel::after { box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 5px var(--surface); }
.tile.sel { z-index: 2; }
.tlab { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; font-size: 11px; line-height: 1.3; pointer-events: none; overflow: hidden; padding: 4px 4px 0 6px; }
.tlab .tn { font-weight: 650; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lc, 1); overflow: hidden; word-break: break-all; text-wrap: balance; }
.tlab .tv { opacity: .78; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile.big .tlab { font-size: 13px; padding: 7px 6px 0 9px; }
.ghead { position: absolute; height: 20px; display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden;
  transition: left .36s cubic-bezier(.2,.7,.2,1), top .36s cubic-bezier(.2,.7,.2,1), width .36s cubic-bezier(.2,.7,.2,1), opacity .2s; }
.ghead span { font-weight: 400; color: var(--ink3); font-variant-numeric: tabular-nums; }
.ghead:hover { text-decoration: underline; text-underline-offset: 3px; }
.ghead.gone { opacity: 0; pointer-events: none; }
.tm.noanim .tile, .tm.noanim .ghead, .tm.noanim .kr { transition: none; }
.tm-legend { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-top: 12px; color: var(--ink3); font-size: 12px; min-height: 20px; }
.tm-legend .kinds { display: flex; gap: 4px 14px; flex-wrap: wrap; }
.tm-legend .lens { display: inline-flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.tm-legend .lens b { font-weight: 600; color: var(--ink2); margin-right: 4px; }
.tm-legend .nil { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; }
.tm-legend .nil i { width: 18px; height: 9px; border-radius: 2px; background: var(--qx); box-shadow: inset 0 0 0 1px var(--line2); display: block; }
.tm-legend button { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.tm-legend button:hover { color: var(--ink); }
.tm-legend button.off { opacity: .35; }
.sw { width: 10px; height: 10px; border-radius: 2.5px; display: inline-block; }
.ramp { display: inline-flex; gap: 2px; }
.ramp i { width: 18px; height: 9px; border-radius: 2px; display: block; }
@media (max-width: 640px) { .tm { height: 400px; } .dn { grid-template-columns: 118px minmax(0, 1fr); gap: 10px; } }

/* inspector */
.ih-t { font-size: 20px; font-weight: 650; line-height: 1.25; }
.ih-s { color: var(--ink2); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
/* one site's page in 檢視台 (structure design 2026-11-17 section 二): the inspector's one way there, ink as every act */
.ih-go { display: inline-flex; align-items: center; margin-top: 10px; padding: 6px 12px; border-radius: 8px; background: var(--act); color: var(--on-act); font-size: 13px; font-weight: 650; text-decoration: none; }
.ih-go:hover { opacity: .88; }
.ih-go[hidden] { display: none; }
#tbl a.nm-a { color: inherit; text-decoration: none; }
#tbl a.nm-a:hover { text-decoration: underline; text-underline-offset: 2px; }
.tag { display: inline-block; padding: 0 6px; border-radius: 5px; background: var(--hover); color: var(--ink2); font-size: 11px; margin-left: 6px; white-space: nowrap; }
.dn { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; margin-top: 14px; }
.dn svg { display: block; width: 100%; height: auto; }
.dn-track { fill: none; stroke: var(--line); stroke-width: 22; }
.dn path { cursor: pointer; transition: opacity .2s; }
#dnV { font-size: 20px; font-weight: 650; fill: var(--ink); }
#dnL { font-size: 11px; fill: var(--ink3); }
.kl { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.kl li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.kl li:hover { background: var(--hover); }
.kl li.off { opacity: .38; }
.kl i { width: 10px; height: 4px; border-radius: 2px; background: var(--c); }
.kl b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }
.tabs button { justify-content: center; padding: 4px 6px; }
.sec { margin-top: 16px; }
.sec h3 { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.sec .sum { margin-left: auto; font-weight: 400; color: var(--ink3); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.yr { display: block; width: 100%; height: 54px; }
.yr rect.b { fill: var(--yc, var(--amt)); opacity: .6; }
.yr rect.h { fill: transparent; }
.yr g:hover rect.b { opacity: 1; }
.yr-x { display: flex; justify-content: space-between; color: var(--ink3); font-size: 11px; margin-top: 2px; }
/* one row form for everything below the donut: a name, a bar, a figure (meters and ranked lists alike) */
.rk { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr) 52px; gap: 8px; align-items: center; padding: 3px 0; font-size: 12px; }
.rk > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.rk .bar i { display: block; height: 100%; border-radius: 3px; background: var(--amt); opacity: .6; }
.rk b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.rk.rest { color: var(--ink3); }
.rk.rest b { font-weight: 400; }
.rk.m { grid-template-columns: 64px minmax(0, 1fr) 44px; }
.rk.m .bar i { background: var(--q3); opacity: 1; }
.rk.m.hot .bar i { background: var(--q5); }
.got { color: var(--ink2); font-size: 12px; }
.got b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.stack { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0 6px; }
.stack i { display: block; flex: 0 1 0; min-width: 0; }
.o-got { background: var(--ink2); } .o-next { background: var(--q4); } .o-todo { background: var(--q2); }
.o-fail { background: var(--bad); } .o-login { background: var(--ink3); } .o-gone { background: var(--line2); }
.rw { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 2px 0; font-size: 12px; }
.rw i { width: 10px; height: 10px; border-radius: 2px; }
.rw b { font-weight: 600; font-variant-numeric: tabular-nums; }
.note { color: var(--ink3); font-size: 12px; margin-top: 8px; }
/* a reminder of the build's checks: a name and its figure, what it means floating over the row */
.ck { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 12px; }
.ck b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* dates */
/* the readout above the chart: the count on the right, under the buttons that change it, its period just left of it
   (owner 11-15: 「幾份文件應該在右邊顯示更人性化」); in 各類型 the kinds' chips on the left, as the lines' legend */
.ro { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 6px; min-height: 26px; }
.ro-n { margin-left: auto; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.ro-v { font-size: 20px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ro-u { color: var(--ink3); margin-left: 3px; font-size: 12px; }
.ro-l { color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
.ro-k { display: flex; gap: 4px; flex-wrap: wrap; }
.ro-k button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.ro-k button.off { opacity: .38; }
.ro-k i { width: 12px; height: 3px; border-radius: 2px; }
.ro-k b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 1ch; }
#tc { display: block; width: 100%; height: 250px; }
#nav { display: block; width: 100%; height: 44px; margin-top: 2px; }
.gy line { stroke: var(--line); shape-rendering: crispEdges; }
.gy text, .gx text, .nx text { fill: var(--ink3); font-size: 11px; font-variant-numeric: tabular-nums; }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { opacity: .1; }
.future { fill: var(--hover); }
.today line { stroke: var(--ink3); shape-rendering: crispEdges; }
.today text { fill: var(--ink3); font-size: 11px; }
.cross line { stroke: var(--ink2); shape-rendering: crispEdges; }
.cross circle { stroke: var(--surface); stroke-width: 2; }
.ov { fill: transparent; cursor: crosshair; touch-action: pan-y; }
.nav-area { fill: var(--navc, var(--amt)); opacity: .3; }
.brush .selection { fill: var(--ink); fill-opacity: .08; stroke: var(--ink3); shape-rendering: crispEdges; }
.brush .handle { fill: var(--ink2); rx: 2px; }
.cal-h { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.cal-h b { font-size: 16px; font-weight: 650; min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.cal-h button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); text-align: center; color: var(--ink2); }
.cal-h button:disabled { opacity: .3; cursor: default; }
.cal-h .lg { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--ink3); font-size: 12px; }
.cal-h .lg i { width: 11px; height: 11px; border-radius: 2px; background: var(--calc); display: inline-block; }
.cal-w { overflow-x: auto; }
#cal { display: block; }
#cal text { fill: var(--ink3); font-size: 11px; }
#cal rect { rx: 2px; cursor: pointer; }
#cal rect.z { fill: var(--hover); }
#cal rect.v { fill: var(--calc); }
#cal rect.on { stroke: var(--ink); stroke-width: 2; }
#cal rect.td { stroke: var(--ink3); stroke-width: 1; }
.cday { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; max-width: 520px; }
.cday h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.cday button { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(40px, 1fr) auto; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
.cday button:hover { background: var(--hover); }
.cday button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cday .bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.cday .bar i { display: block; height: 100%; border-radius: 3px; background: var(--calc, var(--amt)); opacity: .6; }
.cday b { font-weight: 600; font-variant-numeric: tabular-nums; }

/* list */
.seg button b { font-weight: 600; margin-left: 5px; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh)); z-index: 3; background: var(--surface); text-align: left; font-size: 12px; font-weight: 600;
  color: var(--ink3); padding: 7px 8px; white-space: nowrap; box-shadow: inset 0 -1px 0 var(--line2); cursor: pointer; user-select: none; }
th:hover, th[aria-sort] { color: var(--ink); }
th.r, td.r { text-align: right; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--hover); }
tbody tr[aria-selected="true"] td { background: var(--press); }
tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
/* Three levels, told apart by weight, ground and indent (owner 11-15: 「文学院这种大分类和他下面的网站区分太不明显」):

const SITE_PAGE = LINKS.site || 'http://127.0.0.1:18878/site?site=';

const $$ = (q, el) => Array.from((el || document).querySelectorAll(q));

const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = (a, b) => !b ? '—' : a === 0 ? '0%' : 100 * a / b < 1 ? '<1%' : Math.round(100 * a / b) + '%';

      const open = laterOpen.has(w), rows = D.later.map((s, i) => [s, i]).filter(r => r[0].w === w);
      return '<tr class="grow" data-w="' + esc(w) + '" aria-expanded="' + open + '"><td colspan="3"><span class="gn">' + esc(w) + '<span>' + rows.length + '</span></span></td></tr>' +
        (open ? rows.map(([s, i]) => '<tr id="lt' + i + '" class="in"><td>' + (s.h ? '<a href="' + esc(s.h) + '" target="_blank" rel="noopener">' + esc(s.n) + ' ↗</a>' : esc(s.n)) + '</td><td class="c-m">' + esc(s.m || '—') + '</td><td class="c-p" style="color:var(--ink3)">' + esc(s.p) + '</td></tr>').join('') : '');
    }).join('') + '</tbody>';
}

/* ---------- search ---------- */
function findInit() {
  const box = $('#find'), list = $('#findList'); let hits = [], act = 0;
  const close = () => { list.hidden = true; };
  const draw = () => {
    list.innerHTML = hits.map((h, i) => h.s
      ? '<button type="button" class="' + (i === act ? 'act' : '') + '" data-i="' + i + '"><b>' + esc(h.s.n) + '</b><em>' + (byChars() ? fmtChars(sum(h.s.c)) : fmt(h.s.total) + ' 份') + '</em><small>' + esc(GROUPS[h.s.g]) + ' · ' + esc(h.s.s) + '</small></button>'
      : '<button type="button" class="' + (i === act ? 'act' : '') + '" data-i="' + i + '"><b>' + esc(h.l.n) + '</b><em>待抓</em><small>' + esc(h.l.w) + '</small></button>').join('') || '<div class="empty" style="padding:12px 0">沒有找到</div>';
    list.hidden = false;
  };
  const pick = h => {
    close(); box.value = ''; box.blur();
    if (h.s) { if (S.site !== h.s.k) selectSite(h.s.k); return; }
    S.list = 'later'; laterOpen.add(h.l.w); renderLater(); renderList(); const tr = $('#lt' + D.later.indexOf(h.l));
    if (tr) { tr.scrollIntoView({ behavior: 'smooth', block: 'center' }); tr.classList.add('flash'); setTimeout(() => tr.classList.remove('flash'), 2400); }
  };
  box.addEventListener('input', () => {
    const v = box.value.trim().toLowerCase(); if (!v) { close(); return; }
    hits = S0.filter(s => s.n.toLowerCase().includes(v) || s.f.toLowerCase().includes(v) || s.o.toLowerCase().includes(v) || s.k.toLowerCase().includes(v)).slice(0, 7).map(s => ({ s }))
      .concat(D.later.filter(l => l.n.toLowerCase().includes(v) || l.o.toLowerCase().includes(v) || l.h.toLowerCase().includes(v)).slice(0, 4).map(l => ({ l })));
    act = 0; draw();
  });
  box.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { if (hits.length) { act = (act + (ev.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; draw(); } ev.preventDefault(); }
    else if (ev.key === 'Enter' && hits[act] && !list.hidden) pick(hits[act]);
    else if (ev.key === 'Escape') { close(); box.blur(); }
  });
  list.addEventListener('pointerdown', ev => { const b = ev.target.closest('button[data-i]'); if (b) { ev.preventDefault(); pick(hits[+b.dataset.i]); } });
  box.addEventListener('blur', () => setTimeout(close, 120));
}

/* ---------- wiring ---------- */
function render() { renderBar(); renderMap(); renderInsp(); renderTime(); renderList(); }
function init() {
  tmInit(); tcInit(); findInit(); renderLater();
  $('#foot').textContent = '資料：正式庫 aca.db（' + D.built + ' 建）、各網站的匯出清單和建庫報告，唯讀。「今天」按 ' + D.today + ' 算。' +
    (D.live ? '頁面每分鐘檢查一次，庫換了會自己更新。' : '');
  const view = D.live ? takeView() : null;
  if (view && view.s) restoreView(view.s);
  $('#crumbs').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-go]'); if (!b) return;
    if (b.dataset.go === 'all') { S.grp = null; S.site = null; } else { S.grp = +b.dataset.g; S.site = null; }
    render();
  });
  $('#chips').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-x]'); if (!b) return;
    if (b.dataset.x === 'kinds') S.kinds = [true, true, true, true, true]; else S.link = false;
    render();
  });
  const key = $('#tmKey'), help = $('#tmHelp'), setKey = on => { key.hidden = !on; help.setAttribute('aria-expanded', String(on)); };
  help.addEventListener('click', ev => { ev.stopPropagation(); setKey(key.hidden); });
  document.addEventListener('click', ev => { if (!key.hidden && !ev.target.closest('#tmKey')) setKey(false); });
  $('#tmBack').addEventListener('click', () => { S.grp = null; S.site = null; render(); });
  $('#segMetric').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && !b.disabled) { S.metric = b.dataset.v; render(); } });
  $('#segLens').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) {
    S.lens = S.lens === b.dataset.v ? null : b.dataset.v; hideTip();
    if (S.lens) { S.sort = LENS_COL[S.lens]; S.dir = -1; } else S.sort = 'group';
    renderMap(); renderList();
  } });
  $('#segList').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { S.list = b.dataset.v; renderList(); } });
  $('#tmLegend').addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (b) toggleKind(+b.dataset.k); });
  const klick = ev => { const li = ev.target.closest('li[data-k]'); if (li) toggleKind(+li.dataset.k); };
  $('#kl').addEventListener('click', klick);
  $('#kl').addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); klick(ev); } });
  $('#segTab').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { S.tab = b.dataset.v; renderInsp(); } });
  $('#roK').addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (b) toggleKind(+b.dataset.k); });
  $('#segRange').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; S.range = b.dataset.v; syncSeg('segRange', S.range); const w = rangeWin(S.range); setWindow(w[0], w[1], 320); });
  $('#segSplit').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { S.split = b.dataset.v === '1'; renderTime(); } });
  $('#segView').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { S.view = b.dataset.v; tc.hover = null; renderTime(); if (S.view === 'line') tcSize(); } });
  $('#btnLink').addEventListener('click', () => { S.link = !S.link; render(); });
  $('#calPrev').addEventListener('click', () => { S.calYear--; S.calDay = null; drawCal(); });
  $('#calNext').addEventListener('click', () => { S.calYear++; S.calDay = null; drawCal(); });
  $('#calDay').addEventListener('click', ev => { const b = ev.target.closest('button[data-k]'); if (b && S.site !== b.dataset.k) selectSite(b.dataset.k); });
  $('#tbl').addEventListener('click', ev => {
    if (ev.target.closest('a[href]')) return;  // a site's name goes to its page in 檢視台
    const f = ev.target.closest('button[data-fold]');
    if (f) { const k = f.dataset.fold; if (S.unfold.has(k)) S.unfold.delete(k); else S.unfold.add(k); hideTip(); renderList(); return; }
    const th = ev.target.closest('th[data-s]');
    if (th) { const k = th.dataset.s; if (k === 'group') S.sort = 'group'; else if (S.sort === k) S.dir = -S.dir; else { S.sort = k; S.dir = -1; } renderList(); return; }
    const g = ev.target.closest('tr.grow');
    if (g) { const gi = +g.dataset.g; if (S.gopen.has(gi)) S.gopen.delete(gi); else S.gopen.add(gi); renderList(); return; }
    const tr = ev.target.closest('tr[data-k]'); if (tr) selectSite(tr.dataset.k, 'list');
  });
  $('#tblLater').addEventListener('click', ev => {
    const g = ev.target.closest('tr.grow[data-w]');
    if (g) { const w = g.dataset.w; if (laterOpen.has(w)) laterOpen.delete(w); else laterOpen.add(w); renderLater(); }
  });
  $('#tw').addEventListener('keydown', ev => {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    const trs = $$('#tbl tr[data-k]'); if (!trs.length) return;
    let i = trs.findIndex(t => t.dataset.k === S.site);
    i = i < 0 ? 0 : Math.max(0, Math.min(trs.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)));
    ev.preventDefault(); S.site = trs[i].dataset.k; render();
    const tr = $$('#tbl tr[data-k]')[i]; if (tr) tr.scrollIntoView({ block: 'nearest' });
  });
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input')) return;
    if (ev.key === 'Escape') { if (!key.hidden) { setKey(false); return; } if (S.site) S.site = null; else if (S.grp !== null) S.grp = null; else return; render(); }
    else if (ev.key === '/') { ev.preventDefault(); $('#find').focus(); }
  });
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(setBarH).observe($('#bar'));
    let w0 = 0;
    new ResizeObserver(() => { const w = tm.el.clientWidth; if (w === w0) return; w0 = w; tm.el.classList.add('noanim'); renderMap(); requestAnimationFrame(() => tm.el.classList.remove('noanim')); if (S.view === 'line') tcSize(); else drawCal(); }).observe(tm.el);
  }
  render(); tcSize();
  requestAnimationFrame(() => { tm.el.classList.remove('noanim'); animate = true; if (view) scrollTo(0, view.y || 0); });
  if (D.live) watchLive();
}
if (typeof d3 === 'undefined') document.querySelector('.app').insertAdjacentHTML('afterbegin', '<div class="card" style="margin-top:16px">圖表庫沒有載入成功，請重新整理頁面再試。</div>');
else init();
})();
</script>
